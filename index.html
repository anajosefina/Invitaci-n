<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeebeb"><meta name="description" content="¡Nos recibimos! 18 de diciembre de 2026. Guardá la fecha."><title>¡Nos recibimos! · Jo y Mati</title><style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#eeebeb;color:#111;font-family:Arial,Helvetica,sans-serif}main{width:100%;max-width:650px;margin:auto;box-shadow:0 0 50px #0000000a}.page{position:relative;width:100%;overflow:hidden;line-height:0}.page>img{width:100%;height:auto;display:block}.overlay{position:absolute;left:5%;right:5%;line-height:1.3;text-align:center}.countdown{top:26%;background:#eeebebee;border-radius:18px;padding:15px 8px;box-shadow:0 6px 28px #0000000c}.countdown small{display:block;font-size:clamp(12px,2.8vw,16px);letter-spacing:.12em;font-weight:700;margin-bottom:10px}.digits{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.digits b{display:block;font-size:clamp(24px,7vw,43px);font-weight:900}.digits span{display:block;font-size:clamp(9px,2.5vw,13px);text-transform:uppercase}.location{top:48%}.rsvp{top:43%;display:flex;flex-direction:column;align-items:center;gap:12px}.btn{display:inline-block;border:2px solid #111;border-radius:999px;background:#111;color:white;padding:14px 20px;text-decoration:none;font-weight:800;font-size:clamp(14px,3.6vw,18px);line-height:1.25;cursor:pointer}.btn:focus-visible{outline:3px solid #0aacae;outline-offset:4px}.btn[aria-disabled="true"]{opacity:.58;cursor:default}.hint{font-size:12px;margin-top:10px;line-height:1.4}footer{font-size:12px;text-align:center;padding:18px;background:#eeebeb;line-height:1.4}@media(prefers-reduced-motion:no-preference){.reveal{animation:appear .7s ease both}@keyframes appear{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}</style></head><body>
<main><section class="page" aria-label="Nos recibimos"><img src="1.png" alt="Nos recibimos. 18 de diciembre de 2026. Llegó el momento de festejar."></section>
<section class="page" aria-label="Reservá la fecha"><img src="2.png" alt="Reservá la fecha: 18 de diciembre de 2026."><div class="overlay countdown reveal"><small>FALTA CADA VEZ MENOS</small><div class="digits" id="timer" aria-live="off"><div><b id="days">--</b><span>Días</span></div><div><b id="hours">--</b><span>Horas</span></div><div><b id="minutes">--</b><span>Minutos</span></div><div><b id="seconds">--</b><span>Segundos</span></div></div></div></section>
<section class="page" aria-label="El lugar"><img src="3.png" alt="El lugar"><div class="overlay location"><a id="map-link" class="btn" aria-disabled="true">📍 Cómo llegar</a><div class="hint" id="map-hint">Ubicación disponible próximamente</div></div></section>
<section class="page" aria-label="Confirmá tu asistencia"><img src="4.png" alt="Confirmá tu asistencia. Nos encantaría verte."><div class="overlay rsvp"><a id="rsvp-link" class="btn" aria-disabled="true">💬 Confirmar con Jo</a><a id="rsvp-link-2" class="btn" aria-disabled="true">💬 Confirmar con Mati</a><div class="hint" id="rsvp-hint">Confirmación disponible próximamente</div></div></section></main>
<footer>Jo &amp; Mati · 18.12.2026</footer>
<script>
// COMPLETAR CUANDO TENGAS LOS DATOS. No hace falta cambiar las imágenes.
const CONFIG={mapsUrl:'https://maps.app.goo.gl/gFiTYa1LCjXPgYnYA',whatsappNumber:'5492266516695',whatsappNumber2:'5492266446228',whatsappMessage:'¡Hola! Confirmo mi asistencia a la recibida de Jo y Mati 🎉'};
const target=new Date('2026-12-18T12:00:00-03:00').getTime();
function tick(){const remaining=Math.max(0,target-Date.now());const vals=[Math.floor(remaining/86400000),Math.floor(remaining/3600000)%24,Math.floor(remaining/60000)%60,Math.floor(remaining/1000)%60];['days','hours','minutes','seconds'].forEach((id,i)=>document.getElementById(id).textContent=String(vals[i]).padStart(2,'0'));if(!remaining)document.querySelector('.countdown small').textContent='¡HOY FESTEJAMOS!'}tick();setInterval(tick,1000);
if(/^https:\/\//.test(CONFIG.mapsUrl)){const a=document.getElementById('map-link');a.href=CONFIG.mapsUrl;a.target='_blank';a.rel='noopener noreferrer';a.removeAttribute('aria-disabled');document.getElementById('map-hint').hidden=true}
const num=CONFIG.whatsappNumber.replace(/\D/g,'');if(num){const a=document.getElementById('rsvp-link');a.href='https://wa.me/'+num+'?text='+encodeURIComponent(CONFIG.whatsappMessage);a.target='_blank';a.rel='noopener noreferrer';a.removeAttribute('aria-disabled');document.getElementById('rsvp-hint').hidden=true}
const num2=CONFIG.whatsappNumber2.replace(/\D/g,'');if(num2){const a=document.getElementById('rsvp-link-2');a.href='https://wa.me/'+num2+'?text='+encodeURIComponent(CONFIG.whatsappMessage);a.target='_blank';a.rel='noopener noreferrer';a.removeAttribute('aria-disabled');document.getElementById('rsvp-hint').hidden=true}
</script></body></html>
